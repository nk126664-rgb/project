<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Habit Tracker - Fixed Version</title>

<link rel="stylesheet" href="n.css">
</head>

<body>

<div class="app">

<!-- AUTH VIEW -->
<div id="authView" class="center">
  <div class="card auth">

    <header>
      <div>
        <h1>Habit Tracker</h1>
        <div class="subtitle">Track daily habits — frontend only</div>
      </div>
    </header>

    <div id="loginForm">
      <label>Username</label>
      <input type="text" id="loginUser" placeholder="demo" />

      <label style="margin-top:8px">Password</label>
      <input type="password" id="loginPass" placeholder="demo123" />

      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-primary" onclick="doLogin()">Login</button>
        <button class="btn btn-ghost" onclick="showSignup()">Register now</button>
      </div>

      <div style="margin-top:8px;">
        <a href="#" onclick="showForgot()">Forgot Password?</a>
      </div>

      <div class="muted" style="margin-top:10px">
        Demo account: <strong>demo / demo123</strong>
      </div>
    </div>

    <div id="signupForm" style="display:none">
      <label>Choose username</label>
      <input type="text" id="signupUser" />

      <label style="margin-top:8px">Password</label>
      <input type="password" id="signupPass" />

      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-primary" onclick="doSignup()">Create account</button>
        <button class="btn btn-ghost" onclick="showLogin()">Back</button>
      </div>
    </div>

    <div id="forgotForm" style="display:none">
      <label>Enter Username</label>
      <input type="text" id="forgotUser" />

      <label style="margin-top:8px">New Password</label>
      <input type="password" id="forgotPass" />

      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn btn-primary" onclick="resetPassword()">Reset</button>
        <button class="btn btn-ghost" onclick="showLogin()">Back</button>
      </div>
    </div>

  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboardView" style="display:none">

  <div class="spaced" style="margin-bottom:12px">
    <div>
      <h1>Your Habits</h1>
      <div class="muted">Add habits and track your progress</div>
    </div>

    <div class="row">
      <div id="currentUser" class="muted"></div>
      <button class="btn btn-ghost" onclick="logout()">Logout</button>
    </div>
  </div>

  <div class="grid">
    <div class="card left">
      <div class="add-habit">
        <input id="newHabit" type="text" placeholder="Add habit" />
        <button class="btn btn-primary" onclick="addHabit()">Add</button>
      </div>
      <ul id="habitList" class="habit-list"></ul>
      <footer>Click a day to mark completed.</footer>
    </div>

    <div class="card right">
      <div class="progress-card">
        <div class="spaced">
          <div class="muted">Overall Progress</div>
          <div id="overallPct">0%</div>
        </div>
        <div class="progress"><i id="overallBar"></i></div>

        <div class="spaced">
          <div class="muted">Today's Completed</div>
          <div id="todayCount">0</div>
        </div>
      </div>
    </div>
  </div>
</div>

</div>

<!-- JS MUST BE HERE (SAME AS ORIGINAL) -->
<script src="m.js"></script>
</body>
</html>
